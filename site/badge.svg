<svg xmlns="http://www.w3.org/2000/svg" width="222" height="20" role="img" aria-label="Featured on: Awesome Japanese">
  <title>Featured on Awesome Japanese</title>
  <linearGradient id="sheen" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="round"><rect width="222" height="20" rx="3" fill="#fff"/></clipPath>
  <g clip-path="url(#round)">
    <rect width="96" height="20" fill="#3a352c"/>
    <rect x="96" width="126" height="20" fill="#284a6b"/>
    <rect width="222" height="20" fill="url(#sheen)"/>
  </g>
  <!-- Sakura mark: five petals rotated about the centre. It carries no text, so
       it can stay a true pale pink that white label text never could. -->
  <g fill="#ffd7e0" opacity=".95">
    <ellipse cx="11" cy="7.4" rx="1.68" ry="2.77"/>
    <ellipse cx="11" cy="7.4" rx="1.68" ry="2.77" transform="rotate(72 11 10)"/>
    <ellipse cx="11" cy="7.4" rx="1.68" ry="2.77" transform="rotate(144 11 10)"/>
    <ellipse cx="11" cy="7.4" rx="1.68" ry="2.77" transform="rotate(216 11 10)"/>
    <ellipse cx="11" cy="7.4" rx="1.68" ry="2.77" transform="rotate(288 11 10)"/>
  </g>
  <circle cx="11" cy="10" r=".84" fill="#fff3a8"/>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="110" text-rendering="geometricPrecision" transform="scale(.1)">
    <text x="553" y="150" fill="#000" fill-opacity=".25">Featured on</text>
    <text x="553" y="140">Featured on</text>
    <text x="1590" y="150" fill="#000" fill-opacity=".25">Awesome Japanese</text>
    <text x="1590" y="140">Awesome Japanese</text>
  </g>
</svg>
